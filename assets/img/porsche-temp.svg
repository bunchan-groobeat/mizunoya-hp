       検収前に社長がポルシェイラスト使用可否を確定 → 可なら正式PNG、不可ならこの汎用イラストで運用。
       ファイル名に -temp を含めgrep検出可能にしている。命名は porsche-temp.png ではなく .svg（下記報告参照）。 -->
  <g fill="#c9ced6">
