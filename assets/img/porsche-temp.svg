  <path d="M96 57 C120 40 168 40 196 44 L182 56 Z" fill="#e6eaf0" stroke="#1a408c" stroke-width="3"/>
  <rect x="16" y="96" width="290" height="6" rx="3" fill="#1a408c"/>
  <circle cx="86" cy="102" r="20" fill="#2a2f38"/><circle cx="86" cy="102" r="8" fill="#c9ced6"/>
  <circle cx="240" cy="102" r="20" fill="#2a2f38"/><circle cx="240" cy="102" r="8" fill="#c9ced6"/>
  <text x="160" y="130" fill="#8a919c" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">TEMP ILLUSTRATION</text>
